<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greetings in the six UN official languages</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #f4f8fc; color: #12324f; }
  h1 { text-align: center; }
  ul { list-style: none; margin: 2rem auto; padding: 0; max-width: 56rem;
       display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
  li { background: #fff; border: 1px solid #009edb; border-radius: 8px; padding: 1rem; text-align: center; }
  .label { display: block; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: #009edb; }
  .greeting { display: block; font-size: 2.2rem; margin-top: .5rem; }
</style>
</head>
<body>
<h1>Hello, world — in six languages</h1>
<ul>
  <li lang="ar" dir="rtl"><span class="label" lang="en" dir="ltr">Arabic</span><span class="greeting">مرحبا</span></li>
  <li lang="zh-Hans"><span class="label" lang="en">Chinese</span><span class="greeting">你好</span></li>
  <li lang="en"><span class="label">English</span><span class="greeting">Hello</span></li>
  <li lang="fr"><span class="label" lang="en">French</span><span class="greeting">Bonjour</span></li>
  <li lang="ru"><span class="label" lang="en">Russian</span><span class="greeting">Здравствуйте</span></li>
  <li lang="es"><span class="label" lang="en">Spanish</span><span class="greeting">Hola</span></li>
</ul>
</body>
</html>
